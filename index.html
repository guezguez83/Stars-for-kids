<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#DCEFF6;
    --sky-deep:#BFE3EF;
    --paper:#FFFFFF;
    --gold:#FFB100;
    --gold-soft:#FFE39B;
    --coral:#FF6F59;
    --coral-deep:#E85A46;
    --navy:#223047;
    --muted:#7C8AA0;
    --line:#E7EEF3;
    --good:#3DAA6E;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito', sans-serif;
    background:
      radial-gradient(1200px 500px at 50% -10%, var(--sky-deep), var(--sky) 55%, #F4FAFB 100%);
    min-height:100vh;
    color:var(--navy);
    padding:20px 16px 48px;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }
  .app{width:100%; max-width:480px;}

  header{text-align:center; margin-bottom:18px; position:relative;}
  header .eyebrow{
    font-family:'Nunito';
    font-weight:800;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--muted);
  }
  header h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:26px;
    margin:4px 0 2px;
    line-height:1.1;
  }
  header .date{
    font-size:14px;
    color:var(--muted);
    font-weight:700;
    text-transform:capitalize;
  }
  .gear-btn{
    position:absolute;
    top:-4px; right:0;
    width:38px; height:38px;
    border-radius:50%;
    background:var(--paper);
    box-shadow: 0 4px 12px -6px rgba(34,48,71,.3);
    border:none;
    font-size:18px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }

  /* Signature: the star strip */
  .star-strip{
    display:flex;
    justify-content:center;
    gap:8px;
    margin:18px 0 20px;
    flex-wrap:wrap;
  }
  .star-slot{
    width:44px; height:44px;
    display:flex; align-items:center; justify-content:center;
    font-size:28px;
    filter: grayscale(1) opacity(.35);
    transition: transform .25s cubic-bezier(.34,1.56,.64,1), filter .25s ease;
  }
  .star-slot.filled{
    filter:none;
    transform: scale(1.12) rotate(-6deg);
  }
  .star-slot.pop{ animation: pop .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop{
    0%{transform:scale(1) rotate(0);}
    45%{transform:scale(1.5) rotate(-12deg);}
    100%{transform:scale(1.12) rotate(-6deg);}
  }

  .card{
    background:var(--paper);
    border-radius:22px;
    box-shadow: 0 8px 24px -12px rgba(34,48,71,.18);
    padding:8px;
    margin-bottom:16px;
  }
  .empty-theme{
    text-align:center; color:var(--muted); font-weight:700; font-size:13.5px;
    padding:24px 10px;
  }

  .item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px;
    border-radius:16px;
    cursor:pointer;
    user-select:none;
    transition: background .15s ease, transform .1s ease;
    position:relative;
    overflow:visible;
  }
  .item:active{ transform: scale(0.98); }
  .item + .item{ margin-top:6px; }
  .item .emoji{
    font-size:36px;
    width:66px; height:66px;
    display:flex; align-items:center; justify-content:center;
    background:var(--sky);
    border-radius:18px;
    flex-shrink:0;
    transition: background .2s ease, transform .2s ease;
  }
  .item.done{ background: linear-gradient(135deg, #FFFCF3, #FFF8E4); }
  .item.done .emoji{ background:var(--gold-soft); transform:scale(1.08) rotate(-4deg); }
  .item .label{
    flex:1;
    font-weight:800;
    font-size:16.5px;
    line-height:1.25;
  }
  .item .check{
    width:34px; height:34px;
    border-radius:50%;
    border:3px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
    flex-shrink:0;
    transition: all .2s ease;
    color:transparent;
  }
  .item.done .check{
    background:var(--good);
    border-color:var(--good);
    color:white;
  }
  .burst{
    position:absolute;
    left:30px; top:8px;
    font-size:22px;
    pointer-events:none;
    animation: burstUp .8s ease-out forwards;
  }
  @keyframes burstUp{
    0%{ opacity:1; transform:translateY(0) scale(0.6); }
    30%{ opacity:1; transform:translateY(-18px) scale(1.2); }
    100%{ opacity:0; transform:translateY(-52px) scale(1); }
  }

  .rewards{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:16px;
  }
  .reward-row{
    background:var(--paper);
    border-radius:16px;
    padding:14px 16px;
    box-shadow: 0 6px 18px -12px rgba(34,48,71,.15);
    border:2px solid transparent;
    transition: border-color .2s ease, background .2s ease;
  }
  .reward-row.reached{
    border-color:var(--gold);
    background: linear-gradient(0deg, #FFFDF6, #FFFFFF);
  }
  .reward-row .rr-top{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }
  .reward-row .rr-stars{
    font-family:'Baloo 2';
    font-weight:700;
    font-size:15px;
    color:var(--navy);
  }
  .reward-row.reached .rr-stars::after{

<body>
<div class="app">

<!-- Settings modal -->

</div>

<script>
const CONFIG_KEY = 'star-tracker-config';
const DATA_KEY = 'star-tracker-data';
const MAX_ACTIVE = 5;

const CATEGORIES = [
  { id:'quotidien', emoji:'🗓️', label:'Quotidien' },
  { id:'ecole', emoji:'🎒', label:'École' },
  { id:'vacances', emoji:'🏖️', label:'Vacances' },
  { id:'weekend', emoji:'🎉', label:'Week-end' },
];

const DEFAULT_ITEMS = [
  { id:'piscine', emoji:'🏊', label:'Je quitte la piscine', category:'vacances', active:true },
  { id:'manger', emoji:'🍽️', label:'Je viens manger', category:'quotidien', active:true },
  { id:'change', emoji:'👕', label:'Je me change', category:'quotidien', active:true },
  { id:'dormir', emoji:'🌙', label:'Je me prépare pour dormir', category:'quotidien', active:true },
  { id:'calme', emoji:'❤️', label:'Je fais un effort pour me calmer', category:'quotidien', active:true },

  { id:'proprement', emoji:'🍝', label:'Je mange proprement', category:'quotidien', active:false },
  { id:'table', emoji:'🪑', label:'Je me tiens bien à table', category:'quotidien', active:false },
  { id:'douche', emoji:'🚿', label:'Je prends ma douche', category:'quotidien', active:false },
  { id:'ecoute', emoji:'👂', label:'J’écoute papa/maman', category:'quotidien', active:false },
  { id:'medicaments', emoji:'💊', label:'Je prends mes médicaments', category:'quotidien', active:false },
  { id:'partage', emoji:'🤝', label:'Je partage un jouet', category:'quotidien', active:false },
  { id:'merci', emoji:'🙏', label:'Je dis merci / s’il te plaît', category:'quotidien', active:false },
  { id:'dents', emoji:'🪥', label:'Je me brosse les dents', category:'quotidien', active:false },
  { id:'mains', emoji:'👐', label:'Je garde mes mains pour moi', category:'quotidien', active:false },
  { id:'mots', emoji:'🗣️', label:'Je dis ce que je veux avec des mots', category:'quotidien', active:false },
  { id:'oppose', emoji:'🚶', label:'Je viens sans faire d’opposition', category:'quotidien', active:false },
  { id:'essaie', emoji:'💪', label:'J’essaie même si je n’ai pas envie', category:'quotidien', active:false },
  { id:'colere', emoji:'😤', label:'Je suis en colère mais je ne tape pas', category:'quotidien', active:false },

  { id:'creme', emoji:'🧴', label:'Je mets de la crème solaire', category:'vacances', active:false },
  { id:'valise', emoji:'🧳', label:'Je range ma valise avec papa', category:'vacances', active:false },
  { id:'sieste', emoji:'😴', label:'Je fais la sieste sans protester', category:'vacances', active:false },

  { id:'sac', emoji:'🎒', label:'Je prépare mon sac', category:'ecole', active:false },
  { id:'reveil', emoji:'⏰', label:'Je me lève quand le réveil sonne', category:'ecole', active:false },
  { id:'devoirs', emoji:'📝', label:'Je fais mes devoirs sans négocier', category:'ecole', active:false },
  { id:'chaussures', emoji:'👟', label:'Je mets mes chaussures seul', category:'ecole', active:false },

  { id:'tour', emoji:'🎢', label:'J’attends mon tour sans crier', category:'weekend', active:false },
  { id:'chambre', emoji:'🧹', label:'Je range ma chambre', category:'weekend', active:false },
];

const DEFAULT_REWARDS = [
  { id:'r1', emoji:'📖', text:'2 histoires du soir', tiers:[1] },
  { id:'r2', emoji:'🎮', text:'Jeu avec papa', tiers:[1] },
  { id:'r3', emoji:'⏱️', text:'10 min de jeu spécial', tiers:[1] },
  { id:'r4', emoji:'🍫', text:'Choisir le dessert', tiers:[1] },
  { id:'r5', emoji:'🏖️', text:'Piscine, plage ou parc', tiers:[3] },
  { id:'r6', emoji:'🎲', text:'Jeu de société', tiers:[3] },
  { id:'r7', emoji:'📺', text:'Choisir un dessin animé', tiers:[3] },
  { id:'r8', emoji:'🍦', text:'Glace au restaurant', tiers:[3,5] },
  { id:'r9', emoji:'🧑‍🤝‍🧑', text:'Activité spéciale avec papa', tiers:[5] },
  { id:'r10', emoji:'🗺️', text:'Choisir une sortie', tiers:[5] },
  { id:'r11', emoji:'🎁', text:'Petit cadeau', tiers:[5] },
  { id:'r12', emoji:'🎵', text:'Musique dans la voiture', tiers:[] },
  { id:'r13', emoji:'🛁', text:'Choisir le bain moussant', tiers:[] },
  { id:'r14', emoji:'🤗', text:'Un câlin spécial', tiers:[] },
  { id:'r15', emoji:'👕', text:'Choisir ses habits', tiers:[] },
  { id:'r16', emoji:'🎉', text:'Petite sortie spéciale', tiers:[] },
  { id:'r17', emoji:'🧁', text:'Cuisiner un gâteau ensemble', tiers:[] },
  { id:'r18', emoji:'📷', text:'Regarder des photos/vidéos de bébé', tiers:[] },
  { id:'r19', emoji:'💦', text:'Jeu d’eau dans le jardin', tiers:[] },
  { id:'r20', emoji:'🌈', text:'Journée spéciale au choix', tiers:[] },
  { id:'r21', emoji:'👫', text:'Inviter un copain à jouer', tiers:[] },
  { id:'r22', emoji:'🧸', text:'Nouveau petit jouet', tiers:[] },
  { id:'r23', emoji:'🦁', text:'Sortie au zoo/musée', tiers:[] },
];

let CONFIG = { items: DEFAULT_ITEMS, rewards: DEFAULT_REWARDS };
let store = { days: {} };
const todayKey = new Date().toLocaleDateString('sv-SE');

function isValidConfig(c){
  return c && Array.isArray(c.items) && c.items.length && ('active' in c.items[0]) && ('category' in c.items[0])
    && Array.isArray(c.rewards);
}

function loadConfig(){
  try{
    const raw = localStorage.getItem(CONFIG_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(isValidConfig(parsed)) CONFIG = parsed;
    }
  }catch(e){}
}
function saveConfig(){
  try{ localStorage.setItem(CONFIG_KEY, JSON.stringify(CONFIG)); }catch(e){}
}

function loadData(){
  try{
    const raw = localStorage.getItem(DATA_KEY);
    if(raw){
      store = JSON.parse(raw);
      if(!store.days) store.days = {};
    }
  }catch(e){ store = { days: {} }; }
}
function saveData(){
  try{
    localStorage.setItem(DATA_KEY, JSON.stringify(store));
    showStatus('Enregistré');
  }catch(e){ showStatus('Non enregistré — réessaie'); }
}

function todayEntry(){
  if(!store.days[todayKey]) store.days[todayKey] = { items:{}, reward:'' };
  return store.days[todayKey];
}
function activeItems(){
  return CONFIG.items.filter(it=> it.active);
}
function totalFor(entry, items){
  const list = items || activeItems();
  return list.reduce((n,it)=> n + (entry.items[it.id] ? 1 : 0), 0);
}
function genId(){ return 'it_' + Math.random().toString(36).slice(2,9); }

function showStatus(msg){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showStatus._t);
  showStatus._t = setTimeout(()=> el.classList.remove('show'), 1400);
}

function formatDate(dateStr){
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
}

/* ---------- Celebration & confetti ---------- */
const CONFETTI_EMOJI = ['⭐','🎉','✨','🌟','🎈'];
function spawnConfetti(count){
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.textContent = CONFETTI_EMOJI[Math.floor(Math.random()*CONFETTI_EMOJI.length)];
    el.style.left = Math.random()*100 + 'vw';
    const duration = 1.6 + Math.random()*1.2;
    el.style.animationDuration = duration + 's';
    el.style.fontSize = (16 + Math.random()*18) + 'px';
    document.body.appendChild(el);
    setTimeout(()=> el.remove(), duration*1000 + 100);
  }
}

function celebrateMilestone(threshold, rewardList){
  const overlay = document.getElementById('celebrateOverlay');
  const emojiMap = {1:'⭐', 3:'🌟', 5:'🏆'};
  document.getElementById('celebrateEmoji').textContent = emojiMap[threshold] || '⭐';
  document.getElementById('celebrateTitle').textContent =
    threshold === 5 ? 'Journée exceptionnelle !' : (threshold === 3 ? 'Super travail !' : 'Bravo, une étoile !');
  const rw = document.getElementById('celebrateRewards');
  rw.innerHTML = (rewardList||[]).map(r=> `<span class="chip"><span class="ce">${r.emoji||'🎁'}</span>${escapeHtml(r.text)}</span>`).join('');
  overlay.classList.add('show');
  spawnConfetti(28);
  clearTimeout(celebrateMilestone._t);
  celebrateMilestone._t = setTimeout(()=> overlay.classList.remove('show'), 2800);
}
document.getElementById('celebrateOverlay').addEventListener('click', ()=>{
  document.getElementById('celebrateOverlay').classList.remove('show');
});

/* ---------- Main render ---------- */
function render(){
  const entry = todayEntry();
  document.getElementById('dateLabel').textContent = formatDate(todayKey);

  const items = activeItems();
  const total = totalFor(entry, items);
  const strip = document.getElementById('starStrip');
  const maxStars = Math.max(items.length, 1);
  const prevFilled = strip.dataset.filled ? parseInt(strip.dataset.filled) : -1;
  strip.innerHTML = '';
  for(let i=1;i<=maxStars;i++){
    const s = document.createElement('div');
    s.className = 'star-slot' + (i<=total ? ' filled' : '');
    if(i<=total && i>prevFilled) s.classList.add('pop');
    s.textContent = '⭐';
    strip.appendChild(s);
  }
  strip.dataset.filled = total;

  const itemsCard = document.getElementById('itemsCard');
  itemsCard.innerHTML = '';
  if(items.length === 0){
    itemsCard.innerHTML = '<div class="empty-theme">Choisis 5 critères dans ⚙️ pour commencer.</div>';
  }else{
    items.forEach(it=>{
      const done = !!entry.items[it.id];
      const row = document.createElement('div');
      row.className = 'item' + (done ? ' done' : '');
      row.innerHTML = `
        <div class="emoji">${it.emoji}</div>
        <div class="label">${it.label}</div>
        <div class="check">✓</div>
      `;
      row.addEventListener('click', ()=> toggleItem(it.id, row));
      itemsCard.appendChild(row);
    });
  }

  renderRewards(total);

  const input = document.getElementById('rewardInput');
  if(document.activeElement !== input) input.value = entry.reward || '';

  renderHistory();
}

function toggleItem(id, rowEl){
  const entry = todayEntry();
  const items = activeItems();
  const wasTotal = totalFor(entry, items);
  entry.items[id] = !entry.items[id];
  const nowChecked = !!entry.items[id];
  const newTotal = totalFor(entry, items);

  if(nowChecked){
    const burst = document.createElement('div');
    burst.className = 'burst';
    burst.textContent = '+1 ⭐';
    rowEl.appendChild(burst);
    setTimeout(()=> burst.remove(), 850);
    spawnConfetti(6);
  }

  render();
  saveData();

  if(nowChecked){
    [1,3,5].forEach(th=>{
      if(wasTotal < th && newTotal >= th){
        const list = CONFIG.rewards.filter(r=> r.tiers && r.tiers.includes(th));
        setTimeout(()=> celebrateMilestone(th, list), 250);
      }
    });
  }
}

function renderRewards(total){
  const rewardsCard = document.getElementById('rewardsCard');
  rewardsCard.innerHTML = '';
  [1,3,5].forEach(th=>{
    const reached = total >= th;
    const list = CONFIG.rewards.filter(r=> r.tiers && r.tiers.includes(th));
    const row = document.createElement('div');
    row.className = 'reward-row' + (reached ? ' reached' : '');
    const chips = list.map(r=> `<span class="chip"><span class="ce">${r.emoji||'🎁'}</span>${escapeHtml(r.text)}</span>`).join('');
    row.innerHTML = `
      <div class="rr-top"><span class="rr-stars">${th} ★</span></div>
      <div class="chip-row">${chips || '<span class="chip">Aucune récompense définie</span>'}</div>
    `;
    rewardsCard.appendChild(row);
  });

  const chosenChips = document.getElementById('chosenChips');
  chosenChips.innerHTML = '';
  const entry = todayEntry();
  [1,3,5].forEach(th=>{
    const list = CONFIG.rewards.filter(r=> r.tiers && r.tiers.includes(th));
    if(!list.length) return;
    const groupTitle = document.createElement('div');
    groupTitle.className = 'chosen-group-title';
    groupTitle.textContent = th + ' ★';
    chosenChips.appendChild(groupTitle);
    const groupRow = document.createElement('div');
    groupRow.className = 'chip-row';
    list.forEach(r=>{
      const label = (r.emoji||'🎁') + ' ' + r.text;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (entry.reward === label ? ' selected' : '');
      b.innerHTML = `<span class="ce">${r.emoji||'🎁'}</span>${escapeHtml(r.text)}`;
      b.addEventListener('click', ()=>{
        entry.reward = label;
        document.getElementById('rewardInput').value = label;
        saveData();
        renderRewards(total);
      });
      groupRow.appendChild(b);
    });
    chosenChips.appendChild(groupRow);
  });
}

document.getElementById('rewardInput').addEventListener('input', (e)=>{
  todayEntry().reward = e.target.value;
  saveData();
});

function renderHistory(){
  const hist = document.getElementById('history');
  const dates = Object.keys(store.days).filter(d=> d !== todayKey).sort((a,b)=> b.localeCompare(a));
  if(dates.length === 0){
    hist.innerHTML = '<div class="empty">Pas encore de journée précédente</div>';
    return;
  }
  hist.innerHTML = dates.map(d=>{
    const e = store.days[d];
    const t = Object.values(e.items||{}).filter(Boolean).length;
    return `
      <div class="hist-row">
        <div>
          <div class="hist-date">${formatDate(d)}</div>
          ${e.reward ? `<div class="hist-reward">${escapeHtml(e.reward)}</div>` : ''}
        </div>
        <div class="hist-stars">${t} ⭐</div>
      </div>
    `;
  }).join('');
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

document.getElementById('historyToggle').addEventListener('click', ()=>{
  document.getElementById('history').classList.toggle('open');
  document.getElementById('chev').classList.toggle('open');
});

/* ---------- Settings modal ---------- */
const modalOverlay = document.getElementById('modalOverlay');
document.getElementById('gearBtn').addEventListener('click', ()=>{
  renderCatalog();
  renderCustomCatSelect();
  renderEditRewards();
  modalOverlay.classList.add('open');
});
document.getElementById('modalClose').addEventListener('click', ()=> modalOverlay.classList.remove('open'));
modalOverlay.addEventListener('click', (e)=>{ if(e.target === modalOverlay) modalOverlay.classList.remove('open'); });

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=> b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=> p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

function activeCount(){ return CONFIG.items.filter(i=> i.active).length; }

function renderCatalog(){
  const banner = document.getElementById('countBanner');
  const n = activeCount();
  banner.className = 'count-banner' + (n === MAX_ACTIVE ? ' full' : '');
  banner.innerHTML = `<span>Critères actifs</span><span><span class="count-num">${n}</span> / ${MAX_ACTIVE}</span>`;

  const wrap = document.getElementById('catalogList');
  wrap.innerHTML = '';
  CATEGORIES.forEach(cat=>{
    const list = CONFIG.items.filter(i=> i.category === cat.id);
    if(!list.length) return;
    const section = document.createElement('div');
    section.className = 'cat-section';
    section.innerHTML = `<div class="cat-title">${cat.emoji} ${cat.label}</div>`;
    list.forEach(it=>{
      const row = document.createElement('div');
      row.className = 'catalog-row' + (it.active ? ' is-active' : '');
      row.innerHTML = `
        <div class="emoji-box">${it.emoji}</div>
        <input type="text" value="${escapeHtml(it.label)}">
        <button class="star-toggle ${it.active ? 'on' : ''}" title="Activer">⭐</button>
        <button class="del-btn">🗑</button>
      `;
      const textInput = row.querySelector('input[type=text]');
      textInput.addEventListener('input', ()=>{ it.label = textInput.value; saveConfig(); render(); });

      row.querySelector('.star-toggle').addEventListener('click', ()=>{
        if(!it.active && activeCount() >= MAX_ACTIVE){
          showStatus('5 critères déjà choisis — désélectionne-en un d’abord');
          return;
        }
        it.active = !it.active;
        saveConfig();
        renderCatalog();
        render();
      });
      row.querySelector('.del-btn').addEventListener('click', ()=>{
        CONFIG.items = CONFIG.items.filter(x=> x.id !== it.id);
        saveConfig();
        renderCatalog();
        render();
      });
      section.appendChild(row);
    });
    wrap.appendChild(section);
  });
}

function renderCustomCatSelect(){
  const wrap = document.getElementById('customCatSelect');
  wrap.innerHTML = '';
  let selected = CATEGORIES[0].id;
  CATEGORIES.forEach((cat, idx)=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'cat-pick' + (idx===0 ? ' on' : '');
    b.textContent = cat.emoji + ' ' + cat.label;
    b.addEventListener('click', ()=>{
      selected = cat.id;
      wrap.querySelectorAll('.cat-pick').forEach(x=> x.classList.remove('on'));
      b.classList.add('on');
      wrap.dataset.selected = selected;
    });
    wrap.appendChild(b);
  });
  wrap.dataset.selected = selected;
}

document.getElementById('addCustomItem').addEventListener('click', ()=>{
  const emojiEl = document.getElementById('customEmoji');
  const labelEl = document.getElementById('customLabel');
  const catWrap = document.getElementById('customCatSelect');
  const label = labelEl.value.trim();
  if(!label) return;
  const emoji = emojiEl.value.trim() || '⭐';
  const category = catWrap.dataset.selected || 'quotidien';
  CONFIG.items.push({ id:genId(), emoji, label, category, active:false });
  saveConfig();
  emojiEl.value = ''; labelEl.value = '';
  renderCatalog();
  render();
});

function renderEditRewards(){
  const wrap = document.getElementById('editRewardsList');
  wrap.innerHTML = '';
  [1,3,5].forEach(th=>{
    const block = document.createElement('section');
    block.className = 'edit-block';
    const current = CONFIG.rewards.filter(r=> r.tiers && r.tiers.includes(th));
    const suggestions = CONFIG.rewards.filter(r=> !r.tiers || !r.tiers.includes(th));

    const titleEl = document.createElement('h3');
    titleEl.textContent = th + ' ★';
    block.appendChild(titleEl);

    const currentRow = document.createElement('div');
    currentRow.className = 'chip-row';
    if(current.length === 0){
      currentRow.innerHTML = '<span class="chip">Rien pour l’instant</span>';
    }else{
      current.forEach(r=>{
        const chip = document.createElement('button');
        chip.className = 'chip';
        chip.innerHTML = `<span class="ce">${r.emoji||'🎁'}</span>${escapeHtml(r.text)} <span class="x">✕</span>`;
        chip.addEventListener('click', ()=>{
          r.tiers = r.tiers.filter(x=> x!==th);
          saveConfig(); renderEditRewards(); render();
        });
        currentRow.appendChild(chip);
      });
    }
    block.appendChild(currentRow);

    const suggestWrap = document.createElement('div');
    suggestWrap.className = 'suggest-wrap';
    const suggestTitle = document.createElement('div');
    suggestTitle.className = 'suggest-title';
    suggestTitle.textContent = 'Ajouter (toutes les récompenses existantes)';
    suggestWrap.appendChild(suggestTitle);
    const suggestRow = document.createElement('div');
    suggestRow.className = 'chip-row';
    suggestions.forEach(r=>{
      const chip = document.createElement('button');
      chip.className = 'chip add-chip';
      chip.innerHTML = `<span class="ce">${r.emoji||'🎁'}</span>${escapeHtml(r.text)}`;
      chip.addEventListener('click', ()=>{
        r.tiers = (r.tiers||[]).concat(th);
        saveConfig(); renderEditRewards(); render();
      });
      suggestRow.appendChild(chip);
    });
    if(suggestions.length === 0){
      suggestRow.innerHTML = '<span class="chip">Tout est déjà ici</span>';
    }
    suggestWrap.appendChild(suggestRow);

    const addCustom = document.createElement('div');
    addCustom.className = 'add-custom';
    addCustom.innerHTML = `
      <input type="text" class="emoji-small" placeholder="🎁" maxlength="4">
      <input type="text" class="label-input" placeholder="Nouvelle récompense...">
      <button>Ajouter</button>
    `;
    const emojiInput = addCustom.querySelector('.emoji-small');
    const textInput = addCustom.querySelector('.label-input');
    addCustom.querySelector('button').addEventListener('click', ()=>{
      const text = textInput.value.trim();
      if(!text) return;
      const emoji = emojiInput.value.trim() || '🎁';
      CONFIG.rewards.push({ id:genId(), emoji, text, tiers:[th] });
      emojiInput.value = ''; textInput.value = '';
      saveConfig(); renderEditRewards(); render();
    });
    suggestWrap.appendChild(addCustom);
    block.appendChild(suggestWrap);

    wrap.appendChild(block);
  });
}

document.getElementById('resetRewardsBtn').addEventListener('click', ()=>{
  CONFIG.rewards = JSON.parse(JSON.stringify(DEFAULT_REWARDS));
  saveConfig();
  renderEditRewards();
  render();
  showStatus('Récompenses réinitialisées');
});

/* ---------- Init ---------- */
loadConfig();
loadData();
render();
</script>
</body>
</html>
