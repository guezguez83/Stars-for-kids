<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#DCEFF6;
    --sky-deep:#BFE3EF;
    --paper:#FFFFFF;
    --gold:#FFB100;
    --gold-soft:#FFE39B;
    --coral:#FF6F59;
    --coral-deep:#E85A46;
    --navy:#223047;
    --muted:#7C8AA0;
    --line:#E7EEF3;
    --good:#3DAA6E;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito', sans-serif;
    background:
      radial-gradient(1200px 500px at 50% -10%, var(--sky-deep), var(--sky) 55%, #F4FAFB 100%);
    min-height:100vh;
    color:var(--navy);
    padding:20px 16px 48px;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }
  .app{width:100%; max-width:480px;}

  header{text-align:center; margin-bottom:18px; position:relative;}
  header .eyebrow{
    font-family:'Nunito';
    font-weight:800;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--muted);
  }
  header h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:26px;
    margin:4px 0 2px;
    line-height:1.1;
  }
  header .date{
    font-size:14px;
    color:var(--muted);
    font-weight:700;
    text-transform:capitalize;
  }
  .gear-btn{
    position:absolute;
    top:-4px; right:0;
    width:38px; height:38px;
    border-radius:50%;
    background:var(--paper);
    box-shadow: 0 4px 12px -6px rgba(34,48,71,.3);
    border:none;
    font-size:18px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }

  .star-strip{
    display:flex;
    justify-content:center;
    gap:8px;
    margin:18px 0 20px;
    flex-wrap:wrap;
  }
  .star-slot{
    width:44px; height:44px;
    display:flex; align-items:center; justify-content:center;
    font-size:28px;
    filter: grayscale(1) opacity(.35);
    transition: transform .25s cubic-bezier(.34,1.56,.64,1), filter .25s ease;
  }
  .star-slot.filled{ filter:none; transform: scale(1.12) rotate(-6deg); }
  .star-slot.pop{ animation: pop .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop{
    0%{transform:scale(1) rotate(0);}
    45%{transform:scale(1.5) rotate(-12deg);}
    100%{transform:scale(1.12) rotate(-6deg);}
  }

  /* Section headers */
  .section-eyebrow{
    display:flex; align-items:center; gap:8px;
    font-family:'Baloo 2'; font-weight:700; font-size:15px;
    color:var(--navy); margin:6px 4px 10px;
  }
  .section-eyebrow .dot{
    width:8px;height:8px;border-radius:50%; background:var(--coral); flex-shrink:0;
  }

  .card{
    background:var(--paper);
    border-radius:22px;
    box-shadow: 0 8px 24px -12px rgba(34,48,71,.18);
    padding:14px;
    margin-bottom:8px;
  }
  .empty-theme{ text-align:center; color:var(--muted); font-weight:700; font-size:13.5px; padding:24px 10px; }

  /* Icon-forward item grid */
  .items-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px;
  }
  .item{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:10px 4px 12px;
    border-radius:18px;
    cursor:pointer; user-select:none;
    position:relative;
    transition: background .15s ease, transform .1s ease;
    background: var(--sky);
    background: linear-gradient(180deg, rgba(220,239,246,.5), rgba(220,239,246,0));
  }
  .item:active{ transform: scale(0.95); }
  .item .emoji{
    font-size:38px;
    width:74px; height:74px;
    display:flex; align-items:center; justify-content:center;
    background:var(--sky);
    border-radius:20px;
    transition: background .2s ease, transform .2s ease;
    box-shadow: 0 4px 10px -6px rgba(34,48,71,.2);
  }
  .item.done .emoji{ background:var(--gold-soft); transform:scale(1.1) rotate(-4deg); }
  .item .ring-pulse{
    position:absolute; top:10px; left:50%; width:74px; height:74px;
    transform:translateX(-50%);
    border-radius:20px; border:4px solid var(--gold);
    pointer-events:none;
    animation: ringPulse 1.1s ease-out forwards;
  }
  @keyframes ringPulse{
    0%{ transform:translateX(-50%) scale(0.85); opacity:1; }
    100%{ transform:translateX(-50%) scale(2.4); opacity:0; }
  }
  .item .label{
    font-weight:800; font-size:11.5px; line-height:1.15; text-align:center;
    color:var(--muted); max-width:90px;
  }
  .item.done .label{ color:var(--navy); }
  .item .check-badge{
    position:absolute; top:2px; right:14%;
    width:26px; height:26px; border-radius:50%;
    border:3px solid var(--paper);
    background:var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; color:transparent;
    transition: all .2s ease;
  }
  .item.done .check-badge{ background:var(--good); color:white; }
  .burst{
    position:absolute; left:50%; top:0; transform:translateX(-50%);
    font-size:26px; font-weight:900; pointer-events:none;
    animation: burstUp 1.3s ease-out forwards;
    text-shadow: 0 2px 8px rgba(255,177,0,.6);
  }
  @keyframes burstUp{
    0%{ opacity:1; transform:translate(-50%,0) scale(0.6); }
    25%{ opacity:1; transform:translate(-50%,-20px) scale(1.4); }
    100%{ opacity:0; transform:translate(-50%,-85px) scale(1.1); }
  }

  /* Rewards zone - visually distinct panel */
  .rewards-panel{
    background: linear-gradient(160deg, #FFF9E9, #FFF2CE 60%, #FFEAB8);
    border-radius:26px;
    padding:16px 14px;
    margin: 18px 0 16px;
    box-shadow: 0 10px 26px -14px rgba(255,177,0,.45);
  }
  .rewards-panel .section-eyebrow{ color:#8A5B00; }
  .rewards-panel .section-eyebrow .dot{ background:var(--gold); }

  .rewards{ display:flex; flex-direction:column; gap:14px; }

  .level-card{
    border-radius:22px;
    padding:16px;
    position:relative;
    overflow:hidden;
    transition: transform .25s ease;
    background: var(--paper);
    box-shadow: 0 6px 16px -12px rgba(34,48,71,.25);
  }
  .level-card.tier-1{ --tier-a:#F0D5B8; --tier-b:#E0A96B; --tier-glow:#C97B3D; }
  .level-card.tier-3{ --tier-a:#E4EDF5; --tier-b:#AFC3D6; --tier-glow:#7C93AB; }
  .level-card.tier-5{ --tier-a:#FFE9A8; --tier-b:#FFC24B; --tier-glow:#FF9E2C; }

  .level-card.locked{ background:#F1F3F5; }
  .level-card.unlocked{
    background: linear-gradient(160deg, var(--tier-a), var(--tier-b));
    transform: scale(1.02);
    box-shadow: 0 14px 28px -14px var(--tier-glow);
  }
  .level-card.unlocked.tier-5{ transform: scale(1.04); }
  .level-card.unlocked::before{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.55) 45%, transparent 60%);
    background-size: 250% 250%;
    animation: shimmer 3s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes shimmer{
    0%{ background-position: -120% -120%; }
    100%{ background-position: 120% 120%; }
  }

  .level-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; position:relative; z-index:1; }
  .level-badge{ display:flex; align-items:center; gap:8px; font-family:'Baloo 2'; font-weight:700; font-size:16px; }
  .medal-wrap{ position:relative; display:inline-flex; align-items:center; justify-content:center; }
  .level-badge .lb-icon{ font-size:28px; display:inline-block; }
  .level-card.locked .lb-icon{ filter:grayscale(1) opacity(.45); }
  .level-card.unlocked .lb-icon{ animation: medalGlow 1.7s ease-in-out infinite; }
  .level-card.unlocked.tier-1 .lb-icon{ --glow:#C97B3D; }
  .level-card.unlocked.tier-3 .lb-icon{ --glow:#9FB4C7; }
  .level-card.unlocked.tier-5 .lb-icon{ --glow:#FFB100; }
  @keyframes medalGlow{
    0%,100%{ filter: drop-shadow(0 0 0px var(--glow, #FFB100)) brightness(1); transform:rotate(-4deg) scale(1); }
    50%{ filter: drop-shadow(0 0 9px var(--glow, #FFB100)) brightness(1.3); transform:rotate(4deg) scale(1.12); }
  }
  .spark{ position:absolute; font-size:12px; pointer-events:none; animation: twinkle 1.5s ease-in-out infinite; }
  .spark.s1{ top:-8px; right:-10px; animation-delay:0s; }
  .spark.s2{ bottom:-6px; left:-10px; font-size:9px; animation-delay:.55s; }
  @keyframes twinkle{
    0%,100%{ opacity:0; transform:scale(.3) rotate(0deg); }
    50%{ opacity:1; transform:scale(1.15) rotate(25deg); }
  }
  .level-card.locked .level-badge{ color:var(--muted); }
  .level-card.unlocked .level-badge{ color:#4A2E00; }
  .level-card.unlocked.tier-3 .level-badge{ color:#28394A; }

  .level-status{ font-size:11.5px; font-weight:800; }
  .level-card.locked .level-status{ color:var(--muted); }
  .unlocked-badge{
    display:inline-flex; align-items:center; gap:4px;
    background:linear-gradient(135deg, #fff, #fff);
    color:#4A2E00; font-family:'Baloo 2'; font-weight:700; font-size:11.5px;
    padding:4px 10px; border-radius:100px;
    animation: badgeBounce .6s cubic-bezier(.34,1.56,.64,1);
    box-shadow: 0 4px 10px -4px rgba(0,0,0,.25);
  }
  @keyframes badgeBounce{
    0%{ transform:scale(0) rotate(-15deg); opacity:0;}
    60%{ transform:scale(1.25) rotate(4deg); opacity:1;}
    100%{ transform:scale(1) rotate(0);}
  }

  .level-progress{
    height:10px; border-radius:100px; background:rgba(0,0,0,.08); overflow:hidden; margin-bottom:12px; position:relative; z-index:1;
  }
  .level-card.unlocked .level-progress{ background:rgba(255,255,255,.4); }
  .level-progress-fill{
    height:100%; border-radius:100px;
    background: linear-gradient(90deg, var(--coral), var(--gold));
    transition: width .4s cubic-bezier(.34,1.56,.64,1);
  }
  .level-card.unlocked .level-progress-fill{ background:#4A2E00; }

  .reward-tiles{ display:flex; flex-wrap:wrap; gap:10px; position:relative; z-index:1; }
  .reward-tile{ display:flex; flex-direction:column; align-items:center; gap:4px; width:64px; }
  .reward-tile .rt-emoji{
    font-size:28px; width:56px; height:56px; border-radius:16px;
    background:rgba(255,255,255,.7);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 3px 8px -4px rgba(0,0,0,.2);
    transition: all .3s ease;
  }
  .level-card.locked .reward-tile .rt-emoji{ background:rgba(255,255,255,.6); }
  .level-card.unlocked .reward-tile .rt-emoji{ transform:scale(1.05); background:rgba(255,255,255,.85); }
  .reward-tile .rt-cap{ font-size:9.5px; font-weight:700; text-align:center; line-height:1.15; }
  .level-card.locked .rt-cap{ color:var(--muted); }
  .level-card.unlocked .rt-cap{ color:#4A2E00; font-weight:800; }
  .level-card.unlocked.tier-3 .rt-cap{ color:#28394A; }
  .reward-tile.empty-tile{ width:auto; }
  .reward-tile.empty-tile .rt-cap{ font-size:11.5px; padding:6px 0; }

  .chosen{
    background:var(--paper);
    border-radius:18px;
    padding:14px 14px 16px;
    box-shadow: 0 6px 18px -12px rgba(34,48,71,.15);
    margin-bottom:16px;
  }
  .chosen label{ display:block; font-family:'Baloo 2'; font-weight:700; font-size:14px; margin-bottom:8px; }
  .chosen input{
    width:100%; border:2px solid var(--line); border-radius:12px; padding:10px 12px;
    font-family:'Nunito'; font-weight:700; font-size:14.5px; color:var(--navy);
    background:var(--sky); margin-bottom:10px;
  }
  .chosen input:focus{ outline:none; border-color:var(--gold); }
  .chosen-group-title{
    font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase;
    letter-spacing:.06em; margin:10px 0 6px;
  }
  .chosen-group-title:first-child{ margin-top:0; }
  #chosenTiles{ display:flex; flex-direction:column; gap:2px; }
  .reward-tile-btn{
    display:inline-flex; flex-direction:column; align-items:center; gap:3px; width:58px;
    background:none; border:none; padding:0;
  }
  .reward-tile-btn .rt-emoji{
    font-size:22px; width:48px; height:48px; border-radius:14px; background:var(--sky);
    display:flex; align-items:center; justify-content:center; border:2px solid transparent;
    transition: all .15s ease;
  }
  .reward-tile-btn.selected .rt-emoji{ background:var(--coral); border-color:var(--coral-deep); }
  .reward-tile-btn .rt-cap{ font-size:8.5px; font-weight:700; color:var(--muted); text-align:center; line-height:1.15; }
  .reward-tile-btn.selected .rt-cap{ color:var(--coral-deep); }

  /* Stats card */
  .stats-card{
    background: linear-gradient(160deg, var(--navy), #1a2740);
    border-radius:20px; padding:16px; margin-bottom:16px; color:white;
    display:flex; gap:10px;
  }
  .stat-box{ flex:1; text-align:center; }
  .stat-box .stat-num{ font-family:'Baloo 2'; font-weight:700; font-size:24px; }
  .stat-box .stat-label{ font-size:10.5px; font-weight:700; color:#A9B7CC; margin-top:2px; }
  .stat-divider{ width:1px; background:rgba(255,255,255,.15); }

  .mega-card{
    border-radius:20px; padding:16px; margin-bottom:16px;
    display:flex; align-items:center; gap:12px;
    transition: all .3s ease;
    background: var(--paper);
    border:2px dashed var(--line);
  }
  .mega-card.unlocked{
    background: linear-gradient(135deg, #FFD36B, #FF9E2C);
    border:2px solid #FF9E2C;
    box-shadow: 0 10px 24px -12px rgba(255,158,44,.6);
  }
  .mega-card .mc-emoji{ font-size:38px; flex-shrink:0; }
  .mega-card .mc-text{ flex:1; }
  .mega-card .mc-title{ font-family:'Baloo 2'; font-weight:700; font-size:14px; }
  .mega-card.unlocked .mc-title{ color:#5C3800; }
  .mega-card .mc-sub{ font-size:11.5px; font-weight:700; color:var(--muted); margin-top:2px; }
  .mega-card.unlocked .mc-sub{ color:#7A4E00; }

  .history-toggle{
    display:flex; align-items:center; justify-content:center; gap:6px;
    color:var(--muted); font-weight:800; font-size:13px; text-align:center; padding:10px; cursor:pointer;
  }
  .chev{ transition: transform .2s ease; display:inline-block; }
  .chev.open{ transform: rotate(180deg); }
  #history{ display:none; }
  #history.open{ display:block; }
  .hist-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; background:var(--paper); border-radius:14px; margin-bottom:8px;
    box-shadow: 0 4px 14px -10px rgba(34,48,71,.15);
  }
  .hist-date{ font-weight:800; font-size:13.5px; text-transform:capitalize; }
  .hist-reward{ font-size:12px; color:var(--muted); font-weight:600; margin-top:2px; }
  .hist-stars{
    font-weight:800; font-size:14px; color:var(--navy);
    display:flex; align-items:center; gap:4px; flex-shrink:0; margin-left:10px;
  }
  .empty{ text-align:center; color:var(--muted); font-weight:700; font-size:13px; padding:16px; }

  .status{
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--navy); color:white; font-weight:700; font-size:12.5px; padding:9px 16px;
    border-radius:100px; opacity:0; transition: all .25s ease; pointer-events:none; white-space:nowrap; z-index:500;
  }
  .status.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* Settings modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(34,48,71,.55); display:none; align-items:flex-end; z-index:800;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:#F4FAFB; width:100%; max-height:88vh; border-radius:24px 24px 0 0;
    overflow-y:auto; padding:18px 16px 30px; animation: slideUp .25s ease-out;
  }
  @keyframes slideUp{ from{ transform:translateY(30px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .modal-head h2{ font-family:'Baloo 2'; font-size:20px; margin:0; }
  .modal-close{
    width:34px; height:34px; border-radius:50%; background:var(--paper); border:none; font-size:16px;
    display:flex; align-items:center; justify-content:center;
  }
  .tabs{ display:flex; background:var(--sky); border-radius:100px; padding:4px; margin-bottom:14px; }
  .tab-btn{
    flex:1; text-align:center; padding:9px; border:none; background:transparent;
    border-radius:100px; font-weight:800; font-size:13.5px; color:var(--muted); cursor:pointer;
  }
  .tab-btn.active{ background:var(--paper); color:var(--navy); box-shadow: 0 3px 8px -4px rgba(34,48,71,.3); }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  .count-banner{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--paper); border-radius:14px; padding:12px 14px; margin-bottom:14px;
    font-family:'Baloo 2'; font-weight:700; font-size:15px;
    position:sticky; top:0; z-index:5;
    box-shadow: 0 6px 16px -10px rgba(34,48,71,.2);
  }
  .count-banner .count-num{ color:var(--coral); }
  .count-banner.full .count-num{ color:var(--good); }

  .cat-section{ margin-bottom:18px; }
  .cat-title{
    font-family:'Baloo 2'; font-size:14.5px; font-weight:700;
    color:var(--muted); margin-bottom:8px; display:flex; align-items:center; gap:6px;
  }

  .catalog-row{
    display:flex; align-items:center; gap:10px;
    background:var(--paper); border-radius:14px; padding:9px 10px; margin-bottom:7px;
    transition: background .2s ease;
  }
  .catalog-row.is-active{ background: linear-gradient(135deg, #FFFCF3, #FFF6DE); }
  .catalog-row .emoji-box{
    width:42px; height:42px; border-radius:12px; background:var(--sky);
    display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;
  }
  .catalog-row.is-active .emoji-box{ background:var(--gold-soft); }
  .catalog-row input[type=text]{
    flex:1; border:2px solid transparent; background:transparent; border-radius:10px; padding:6px 8px;
    font-family:'Nunito'; font-weight:700; font-size:13.5px; color:var(--navy); min-width:0;
  }
  .catalog-row input[type=text]:focus{ outline:none; border-color:var(--line); background:var(--sky); }
  .star-toggle{
    width:36px; height:36px; border-radius:50%; border:2.5px solid var(--line);
    background:transparent; font-size:16px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    color:transparent;
  }
  .star-toggle.on{ background:var(--gold); border-color:var(--gold); color:white; }
  .del-btn{
    width:30px; height:30px; border-radius:50%; border:none; background:#FFE3DE;
    color:var(--coral-deep); font-size:13px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }

  .suggest-wrap{ background:var(--paper); border-radius:14px; padding:14px; margin-top:4px; }
  .suggest-title{ font-size:13px; font-weight:800; color:var(--navy); margin-bottom:10px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    font-size:12.5px; font-weight:700; color:var(--navy); background:var(--sky);
    padding:7px 12px 7px 8px; border-radius:100px; border:none; white-space:nowrap;
    display:inline-flex; align-items:center; gap:5px;
  }
  .chip .ce{ font-size:15px; }
  .chip.add-chip{ background:transparent; border:2px dashed var(--line); color:var(--muted); }
  .chip .x{ font-weight:900; opacity:.6; }

  .add-custom{ display:flex; flex-wrap:wrap; gap:8px; }
  .add-custom input[type=text]{
    border:2px solid var(--line); border-radius:10px; padding:9px 10px;
    font-family:'Nunito'; font-weight:700; font-size:13.5px; min-width:0;
  }
  .add-custom input.emoji-small{ flex:0 0 50px; text-align:center; }
  .add-custom input.label-input{ flex:1 1 100%; }
  .cat-select{ display:flex; gap:6px; flex-wrap:wrap; flex:1 1 100%; }
  .cat-pick{
    font-size:11.5px; font-weight:800; padding:6px 11px; border-radius:100px;
    border:2px solid var(--line); background:transparent; color:var(--muted);
  }
  .cat-pick.on{ background:var(--navy); border-color:var(--navy); color:white; }
  .add-custom button{
    background:var(--coral); color:white; border:none; border-radius:10px;
    padding:0 16px; font-weight:800; font-size:13px; flex:1 1 100%;
  }
  section.edit-block{ margin-bottom:22px; }
  section.edit-block h3{ font-family:'Baloo 2'; font-size:15px; margin:0 0 8px; }

  /* Celebration overlay - full screen takeover */
  .celebrate-overlay{
    position:fixed; inset:0; z-index:1000;
    display:none; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .celebrate-overlay.show{ display:flex; }
  .celebrate-overlay::before{
    content:"";
    position:absolute; inset:0;
    background: conic-gradient(from 0deg, #FFB100, #FF6F59, #3DAA6E, #4C9FE0, #B57BFF, #FFB100);
    opacity:0; animation: rainbowSpin 2.6s linear infinite, rainbowFade 3s ease forwards;
  }
  @keyframes rainbowSpin{ from{ transform:rotate(0deg) scale(2);} to{ transform:rotate(360deg) scale(2);} }
  @keyframes rainbowFade{ 0%{opacity:0;} 12%{opacity:.35;} 80%{opacity:.28;} 100%{opacity:0;} }

  .flash-pulse{
    position:fixed; inset:0; z-index:1001; pointer-events:none;
    background: radial-gradient(circle, rgba(255,255,255,.95), rgba(255,255,255,0) 60%);
    animation: flashOut .6s ease-out forwards;
  }
  @keyframes flashOut{ 0%{ opacity:1; transform:scale(0.3);} 100%{ opacity:0; transform:scale(2.2);} }

  .celebrate-card{
    background:rgba(255,255,255,.97); border-radius:32px; padding:38px 30px; text-align:center;
    max-width:340px; box-shadow: 0 30px 70px -20px rgba(0,0,0,.5);
    animation: celebratePop .55s cubic-bezier(.34,1.56,.64,1);
    position:relative; z-index:1002;
  }
  .celebrate-card.mega{ background: linear-gradient(160deg, #FFE9A8, #FFC24B); }
  @keyframes celebratePop{
    0%{ transform:scale(.3) rotate(-12deg); opacity:0; }
    60%{ transform:scale(1.15) rotate(4deg); opacity:1; }
    100%{ transform:scale(1) rotate(0);}
  }
  .celebrate-emoji{
    font-size:88px; margin-bottom:4px; display:inline-block;
    animation: emojiBounce 0.9s cubic-bezier(.34,1.56,.64,1) infinite;
  }
  @keyframes emojiBounce{
    0%,100%{ transform:translateY(0) rotate(-6deg) scale(1); }
    50%{ transform:translateY(-16px) rotate(6deg) scale(1.12); }
  }
  .celebrate-title{
    font-family:'Baloo 2'; font-size:27px; margin:6px 0 12px;
    animation: titleWiggle 1.4s ease-in-out infinite;
  }
  @keyframes titleWiggle{ 0%,100%{ transform:rotate(-1.5deg);} 50%{ transform:rotate(1.5deg);} }
  .celebrate-rewards{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:10px; }
  .celebrate-close{
    margin-top:20px;
    background: var(--good);
    color:white; border:none; border-radius:100px;
    padding:12px 28px; font-family:'Baloo 2'; font-weight:700; font-size:15px;
    box-shadow: 0 6px 16px -6px rgba(61,170,110,.6);
  }
  .celebrate-close:active{ transform:scale(0.95); }

  .firework-particle{
    position:fixed; z-index:1003; pointer-events:none;
    animation: fireworkOut .9s cubic-bezier(.15,.7,.3,1) forwards;
  }
  @keyframes fireworkOut{
    0%{ transform:translate(0,0) scale(1); opacity:1; }
    100%{ transform:translate(var(--fx), var(--fy)) scale(0.4); opacity:0; }
  }

  .confetti-piece{
    position:fixed; top:-30px; font-size:22px; pointer-events:none; z-index:1050;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall{ to{ transform: translateY(110vh) rotate(360deg); opacity:.9; } }
</style>

<body>
<div class="app">
  <header>
    <button class="gear-btn" id="gearBtn">⚙️</button>
    <div class="eyebrow">Défi des transitions</div>
    <h1>Mon tableau des étoiles</h1>
    <div class="date" id="dateLabel">—</div>
  </header>

  <div class="star-strip" id="starStrip"></div>

  <div class="section-eyebrow"><span class="dot"></span>Mes critères du jour</div>
  <div class="card" id="itemsCardWrap"><div class="items-grid" id="itemsCard"></div></div>

  <div class="rewards-panel">
    <div class="section-eyebrow"><span class="dot"></span>Récompenses à débloquer</div>
    <div class="rewards" id="rewardsCard"></div>
  </div>

  <div class="chosen">
    <label for="rewardInput">Récompense choisie aujourd'hui</label>
    <input id="rewardInput" type="text" placeholder="ex : glace au restaurant">
    <div id="chosenTiles"></div>
  </div>

  <div class="stats-card" id="statsCard"></div>
  <div class="mega-card" id="megaCard"></div>

  <div class="history-toggle" id="historyToggle">
    Journées précédentes <span class="chev" id="chev">▾</span>
  </div>
  <div id="history"></div>
</div>

<div class="status" id="status">Enregistré</div>

<!-- Settings modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>Personnaliser</h2>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="items">Critères</button>
      <button class="tab-btn" data-tab="rewards">Récompenses</button>
    </div>

    <div class="tab-panel active" id="tab-items">
      <div class="count-banner" id="countBanner"></div>
      <div id="catalogList"></div>
      <div class="suggest-wrap">
        <div class="suggest-title">➕ Ajouter un critère personnalisé</div>
        <div class="add-custom">
          <input type="text" id="customEmoji" class="emoji-small" placeholder="🙂" maxlength="4">
          <input type="text" id="customLabel" class="label-input" placeholder="Décris le comportement...">
          <div class="cat-select" id="customCatSelect"></div>
          <button id="addCustomItem">Ajouter au catalogue</button>
        </div>
      </div>
    </div>

    <div class="tab-panel" id="tab-rewards">
      <div class="count-banner" id="rewardsResetBanner">
        <span>Récompenses</span>
        <button id="resetRewardsBtn" style="background:var(--coral);color:white;border:none;border-radius:100px;padding:7px 14px;font-weight:800;font-size:12px;">Réinitialiser</button>

function isValidConfig(c){
  return c && Array.isArray(c.items) && c.items.length && ('active' in c.items[0]) && ('category' in c.items[0])

}

function loadData(){

      if(!store.days) store.days = {};

function todayEntry(){
  if(!store.days[todayKey]) store.days[todayKey] = { items:{}, reward:'' };

}
function activeItems(){ return CONFIG.items.filter(it=> it.active); }
function totalFor(entry, items){
  const list = items || activeItems();
  return list.reduce((n,it)=> n + (entry.items[it.id] ? 1 : 0), 0);
}
function genId(){ return 'it_' + Math.random().toString(36).slice(2,9); }

function formatDate(dateStr){
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
}

/* ---------- Sound ---------- */
let audioCtx = null;
function unlockAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
  }
  if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume(); }
}
function playNote(freq, startTime, duration, type, gainPeak){
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'triangle';
  osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(gainPeak || 0.18, startTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.05);
}
function playChime(kind){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;
  if(kind === 'star'){
    [660, 880].forEach((f,i)=> playNote(f, now + i*0.09, 0.18, 'triangle', 0.15));
  }else if(kind === 'milestone'){
    [523, 659, 784, 1047].forEach((f,i)=> playNote(f, now + i*0.1, 0.28, 'triangle', 0.18));
  }else if(kind === 'mega'){
    [392, 523, 659, 784, 1047, 1319].forEach((f,i)=> playNote(f, now + i*0.11, 0.4, 'sawtooth', 0.14));
  }
}

/* ---------- Confetti & fireworks ---------- */
const CONFETTI_EMOJI = ['⭐','🎉','✨','🌟','🎈','💖','🎊','🏆','💫','❤️','🥳'];
function spawnConfetti(count){
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.textContent = CONFETTI_EMOJI[Math.floor(Math.random()*CONFETTI_EMOJI.length)];
    el.style.left = Math.random()*100 + 'vw';
    const duration = 2.2 + Math.random()*1.8;
    el.style.animationDuration = duration + 's';
    el.style.animationDelay = (Math.random()*0.4) + 's';
    el.style.fontSize = (16 + Math.random()*20) + 'px';
    document.body.appendChild(el);
    setTimeout(()=> el.remove(), duration*1000 + 500);
  }
}
function spawnFirework(cx, cy, particleCount){
  const emojis = ['✨','⭐','🎉','💥','🌟','💖','🥳'];
  for(let i=0;i<particleCount;i++){
    const angle = (Math.PI*2*i)/particleCount + Math.random()*0.4;
    const dist = 70 + Math.random()*90;
    const fx = Math.cos(angle)*dist;
    const fy = Math.sin(angle)*dist;
    const el = document.createElement('div');
    el.className = 'firework-particle';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left = cx + 'px';
    el.style.top = cy + 'px';
    el.style.fontSize = (14 + Math.random()*14) + 'px';
    el.style.setProperty('--fx', fx + 'px');
    el.style.setProperty('--fy', fy + 'px');
    document.body.appendChild(el);
    setTimeout(()=> el.remove(), 950);
  }
}
function spawnFireworkAt(x, y, count){
  spawnFirework(x, y, count);
}
function fireworksShow(bursts){
  const w = window.innerWidth, h = window.innerHeight;
  for(let b=0; b<bursts; b++){
    setTimeout(()=>{
      const cx = w*0.2 + Math.random()*w*0.6;
      const cy = h*0.15 + Math.random()*h*0.45;
      spawnFirework(cx, cy, 16);
    }, b*220);
  }
}

/* ---------- Stats ---------- */
function computeStreak(){
  const maxStars = activeItems().length;
  if(maxStars === 0) return 0;
  let streak = 0;
  const cursor = new Date();
  const tStr = cursor.toLocaleDateString('sv-SE');
  const tEntry = store.days[tStr];
  const tTotal = tEntry ? totalFor(tEntry) : 0;
  if(tTotal === maxStars) streak = 1;
  cursor.setDate(cursor.getDate() - 1);
  while(true){
    const key = cursor.toLocaleDateString('sv-SE');
    const e = store.days[key];
    if(e && totalFor(e) === maxStars){ streak++; cursor.setDate(cursor.getDate()-1); }
    else break;
  }
  return streak;
}
function computeAverage(){
  const dates = Object.keys(store.days);
  if(!dates.length) return 0;
  const sum = dates.reduce((s,d)=> s + totalFor(store.days[d]), 0);
  return Math.round((sum/dates.length)*10)/10;
}

function renderStats(){
  const streak = computeStreak();
  const avg = computeAverage();
  document.getElementById('statsCard').innerHTML = `
    <div class="stat-box"><div class="stat-num">🔥 ${streak}</div><div class="stat-label">Jours parfaits d’affilée</div></div>
    <div class="stat-divider"></div>
    <div class="stat-box"><div class="stat-num">⭐ ${avg}</div><div class="stat-label">Moyenne / jour</div></div>
  `;
  const mega = CONFIG.megaReward || DEFAULT_MEGA_REWARD;
  const unlocked = streak >= 5;
  const megaCard = document.getElementById('megaCard');
  megaCard.className = 'mega-card' + (unlocked ? ' unlocked' : '');
  megaCard.innerHTML = `
    <div class="mc-emoji">${unlocked ? (mega.emoji||'🏆') : '🔒'}</div>
    <div class="mc-text">
      <div class="mc-title">${unlocked ? 'Grande récompense débloquée !' : 'Grande récompense (série de 5 jours)'}</div>
      <div class="mc-sub">${unlocked ? escapeHtml(mega.text) : '5 jours à étoiles complètes d’affilée pour la débloquer'}</div>
    </div>
  `;
}

/* ---------- Main render ---------- */
function render(){
  const entry = todayEntry();
  document.getElementById('dateLabel').textContent = formatDate(todayKey);

  const items = activeItems();
  const total = totalFor(entry, items);
  const strip = document.getElementById('starStrip');
  const maxStars = Math.max(items.length, 1);
  const prevFilled = strip.dataset.filled ? parseInt(strip.dataset.filled) : -1;
  strip.innerHTML = '';
  for(let i=1;i<=maxStars;i++){
    const s = document.createElement('div');
    s.className = 'star-slot' + (i<=total ? ' filled' : '');
    if(i<=total && i>prevFilled) s.classList.add('pop');
    s.textContent = '⭐';
    strip.appendChild(s);
  }
  strip.dataset.filled = total;

  const itemsCard = document.getElementById('itemsCard');
  itemsCard.innerHTML = '';
  if(items.length === 0){
    itemsCard.innerHTML = '<div class="empty-theme">Choisis 5 critères dans ⚙️ pour commencer.</div>';
  }else{
    items.forEach(it=>{
      const done = !!entry.items[it.id];
      const row = document.createElement('div');
      row.className = 'item' + (done ? ' done' : '');
      row.innerHTML = `
        <div class="emoji">${it.emoji}</div>
        <div class="check-badge">✓</div>
        <div class="label">${it.label}</div>
      `;
      row.addEventListener('click', ()=> toggleItem(it.id, row));
      itemsCard.appendChild(row);
    });
  }

  renderRewards(total);
  renderStats();

  const input = document.getElementById('rewardInput');
  if(document.activeElement !== input) input.value = entry.reward || '';

  renderHistory();
}

function toggleItem(id, rowEl){
  unlockAudio();
  const entry = todayEntry();
  const items = activeItems();
  const wasTotal = totalFor(entry, items);
  entry.items[id] = !entry.items[id];
  const nowChecked = !!entry.items[id];
  const newTotal = totalFor(entry, items);

  if(nowChecked){
    screenFlash();

    const ring = document.createElement('div');
    ring.className = 'ring-pulse';
    rowEl.appendChild(ring);
    setTimeout(()=> ring.remove(), 1150);
    setTimeout(()=>{
      const ring2 = document.createElement('div');
      ring2.className = 'ring-pulse';
      rowEl.appendChild(ring2);
      setTimeout(()=> ring2.remove(), 1150);
    }, 220);

    const burst = document.createElement('div');
    burst.className = 'burst';
    burst.textContent = '+1 ⭐';
    rowEl.appendChild(burst);
    setTimeout(()=> burst.remove(), 1350);

    const rect = rowEl.getBoundingClientRect();
    const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    spawnFireworkAt(cx, cy, 22);
    setTimeout(()=> spawnFireworkAt(cx + (Math.random()*60-30), cy + (Math.random()*40-20), 18), 200);
    setTimeout(()=> spawnFireworkAt(cx + (Math.random()*80-40), cy + (Math.random()*60-30), 16), 420);
    setTimeout(()=> spawnFireworkAt(window.innerWidth/2, window.innerHeight*0.35, 14), 650);

    spawnConfetti(45);
    setTimeout(()=> spawnConfetti(25), 350);

    playChime('star');
    setTimeout(()=> playChime('star'), 260);
  }

  render();
  saveData();

  if(nowChecked){
    [1,3,5].forEach(th=>{
      if(wasTotal < th && newTotal >= th){
        const list = CONFIG.rewards[th] || [];
        setTimeout(()=> celebrateMilestone(th, list), 700);
      }
    });
    const newStreak = computeStreak();
    if(newStreak > 0 && newStreak % 5 === 0 && newStreak !== store.lastCelebratedStreak){
      store.lastCelebratedStreak = newStreak;
      saveData();
      setTimeout(()=> celebrateStreak(newStreak), 1500);
    }
  }
}

const TIER_META = {
  1: { icon:'🥉', name:'Palier bronze' },
  3: { icon:'🥈', name:'Palier argent' },

function renderRewards(total){
  const rewardsCard = document.getElementById('rewardsCard');
  rewardsCard.innerHTML = '';
  [1,3,5].forEach(th=>{
    const reached = total >= th;
    const list = CONFIG.rewards[th] || [];

    const pct = Math.min(100, Math.round((total/th)*100));
    const remaining = th - total;
    const row = document.createElement('div');
    row.className = 'level-card tier-' + th + (reached ? ' unlocked' : ' locked');
    const tiles = list.map(r=> `
      <div class="reward-tile">
        <div class="rt-emoji">${r.emoji||'🎁'}</div>
        <div class="rt-cap">${escapeHtml(r.text)}</div>
      </div>`).join('');
    row.innerHTML = `
      <div class="level-head">
        <div class="level-badge"><span class="medal-wrap"><span class="lb-icon">${meta.icon}</span>${reached ? '<span class="spark s1">✨</span><span class="spark s2">✨</span>' : ''}</span>${th} étoiles</div>
        ${reached ? '<span class="unlocked-badge">Récompense débloquée</span>' : `<span class="level-status">Encore ${remaining} ⭐</span>`}
      </div>
      <div class="level-progress"><div class="level-progress-fill" style="width:${pct}%"></div></div>
      <div class="reward-tiles">${tiles || '<div class="reward-tile empty-tile"><div class="rt-cap">Aucune récompense définie</div></div>'}</div>
    `;
    rewardsCard.appendChild(row);
  });

  const chosenTiles = document.getElementById('chosenTiles');
  chosenTiles.innerHTML = '';
  const entry = todayEntry();
  [1,3,5].forEach(th=>{
    const list = CONFIG.rewards[th] || [];
    if(!list.length) return;
    const groupTitle = document.createElement('div');
    groupTitle.className = 'chosen-group-title';
    groupTitle.textContent = th + ' ★';
    chosenTiles.appendChild(groupTitle);
    const groupRow = document.createElement('div');
    groupRow.className = 'reward-tiles';
    list.forEach(r=>{
      const label = (r.emoji||'🎁') + ' ' + r.text;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'reward-tile-btn' + (entry.reward === label ? ' selected' : '');
      b.innerHTML = `<div class="rt-emoji">${r.emoji||'🎁'}</div><div class="rt-cap">${escapeHtml(r.text)}</div>`;
      b.addEventListener('click', ()=>{
        entry.reward = label;
        document.getElementById('rewardInput').value = label;
        saveData();
        renderRewards(total);
      });
      groupRow.appendChild(b);
    });
    chosenTiles.appendChild(groupRow);
  });
}

  saveData();
});

function renderHistory(){
  const hist = document.getElementById('history');
  const dates = Object.keys(store.days).filter(d=> d !== todayKey).sort((a,b)=> b.localeCompare(a));
  if(dates.length === 0){
    hist.innerHTML = '<div class="empty">Pas encore de journée précédente</div>';
    return;
  }
  hist.innerHTML = dates.map(d=>{
    const e = store.days[d];
    const t = Object.values(e.items||{}).filter(Boolean).length;
    return `
      <div class="hist-row">
        <div>
          <div class="hist-date">${formatDate(d)}</div>
          ${e.reward ? `<div class="hist-reward">${escapeHtml(e.reward)}</div>` : ''}
        </div>
        <div class="hist-stars">${t} ⭐</div>
      </div>
    `;
  }).join('');
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=> b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=> p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

function activeCount(){ return CONFIG.items.filter(i=> i.active).length; }

function renderCatalog(){
  const banner = document.getElementById('countBanner');
  const n = activeCount();
  banner.className = 'count-banner' + (n === MAX_ACTIVE ? ' full' : '');
  banner.innerHTML = `<span>Critères actifs</span><span><span class="count-num">${n}</span> / ${MAX_ACTIVE}</span>`;

  const wrap = document.getElementById('catalogList');
  wrap.innerHTML = '';
  CATEGORIES.forEach(cat=>{
    const list = CONFIG.items.filter(i=> i.category === cat.id);
    if(!list.length) return;
    const section = document.createElement('div');
    section.className = 'cat-section';
    section.innerHTML = `<div class="cat-title">${cat.emoji} ${cat.label}</div>`;
    list.forEach(it=>{
      const row = document.createElement('div');
      row.className = 'catalog-row' + (it.active ? ' is-active' : '');
      row.innerHTML = `
        <div class="emoji-box">${it.emoji}</div>
        <input type="text" value="${escapeHtml(it.label)}">
        <button class="star-toggle ${it.active ? 'on' : ''}" title="Activer">⭐</button>
        <button class="del-btn">🗑</button>
      `;
      const textInput = row.querySelector('input[type=text]');
      textInput.addEventListener('input', ()=>{ it.label = textInput.value; saveConfig(); render(); });
      row.querySelector('.star-toggle').addEventListener('click', ()=>{
        if(!it.active && activeCount() >= MAX_ACTIVE){
          showStatus('5 critères déjà choisis — désélectionne-en un d’abord');
          return;
        }
        it.active = !it.active;
        saveConfig();
        renderCatalog();
        render();
      });
      row.querySelector('.del-btn').addEventListener('click', ()=>{
        CONFIG.items = CONFIG.items.filter(x=> x.id !== it.id);
        saveConfig();
        renderCatalog();
        render();
      });
      section.appendChild(row);
    });
    wrap.appendChild(section);
  });
}

function renderCustomCatSelect(){
  const wrap = document.getElementById('customCatSelect');
  wrap.innerHTML = '';
  let selected = CATEGORIES[0].id;
  CATEGORIES.forEach((cat, idx)=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'cat-pick' + (idx===0 ? ' on' : '');
    b.textContent = cat.emoji + ' ' + cat.label;
    b.addEventListener('click', ()=>{
      selected = cat.id;
      wrap.querySelectorAll('.cat-pick').forEach(x=> x.classList.remove('on'));
      b.classList.add('on');
      wrap.dataset.selected = selected;
    });
    wrap.appendChild(b);
  });
  wrap.dataset.selected = selected;
}

document.getElementById('addCustomItem').addEventListener('click', ()=>{
  const emojiEl = document.getElementById('customEmoji');
  const labelEl = document.getElementById('customLabel');
  const catWrap = document.getElementById('customCatSelect');
  const label = labelEl.value.trim();
  if(!label) return;
  const emoji = emojiEl.value.trim() || '⭐';
  const category = catWrap.dataset.selected || 'quotidien';
  CONFIG.items.push({ id:genId(), emoji, label, category, active:false });
  saveConfig();
  emojiEl.value = ''; labelEl.value = '';
  renderCatalog();
  render();
});

function renderEditRewards(){
  const wrap = document.getElementById('editRewardsList');
  wrap.innerHTML = '';
  [1,3,5].forEach(th=>{
    const block = document.createElement('section');
    block.className = 'edit-block';
    const current = CONFIG.rewards[th] || [];
    const suggestions = allRewardsPool().filter(s=> !current.some(c=> c.text === s.text));

    const titleEl = document.createElement('h3');
    titleEl.textContent = th + ' ★';
    block.appendChild(titleEl);

    const currentRow = document.createElement('div');
    currentRow.className = 'chip-row';
    if(current.length === 0){
      currentRow.innerHTML = '<span class="chip">Rien pour l’instant</span>';
    }else{
      current.forEach((r, idx)=>{
        const chip = document.createElement('button');
        chip.className = 'chip';
        chip.innerHTML = `<span class="ce">${r.emoji||'🎁'}</span>${escapeHtml(r.text)} <span class="x">✕</span>`;
        chip.addEventListener('click', ()=>{
          CONFIG.rewards[th] = CONFIG.rewards[th].filter((_,i)=> i!==idx);
          saveConfig(); renderEditRewards(); render();
        });
        currentRow.appendChild(chip);
      });
    }
    block.appendChild(currentRow);

    const suggestWrap = document.createElement('div');
    suggestWrap.className = 'suggest-wrap';
    const suggestTitle = document.createElement('div');
    suggestTitle.className = 'suggest-title';
    suggestTitle.textContent = 'Ajouter (toutes les récompenses existantes)';
    suggestWrap.appendChild(suggestTitle);
    const suggestRow = document.createElement('div');
    suggestRow.className = 'chip-row';
    suggestions.forEach(r=>{
      const chip = document.createElement('button');
      chip.className = 'chip add-chip';
      chip.innerHTML = `<span class="ce">${r.emoji||'🎁'}</span>${escapeHtml(r.text)}`;
      chip.addEventListener('click', ()=>{
        if(!CONFIG.rewards[th]) CONFIG.rewards[th] = [];
        CONFIG.rewards[th].push({ emoji:r.emoji, text:r.text });
        saveConfig(); renderEditRewards(); render();
      });
      suggestRow.appendChild(chip);
    });
    if(suggestions.length === 0) suggestRow.innerHTML = '<span class="chip">Tout est déjà ici</span>';
    suggestWrap.appendChild(suggestRow);

    const addCustom = document.createElement('div');
    addCustom.className = 'add-custom';
    addCustom.innerHTML = `
      <input type="text" class="emoji-small" placeholder="🎁" maxlength="4">
      <input type="text" class="label-input" placeholder="Nouvelle récompense...">
      <button>Ajouter</button>
    `;
    const emojiInput = addCustom.querySelector('.emoji-small');
    const textInput = addCustom.querySelector('.label-input');
    addCustom.querySelector('button').addEventListener('click', ()=>{
      const text = textInput.value.trim();
      if(!text) return;
      const emoji = emojiInput.value.trim() || '🎁';
      if(!CONFIG.rewards[th]) CONFIG.rewards[th] = [];
      CONFIG.rewards[th].push({ emoji, text });
      emojiInput.value=''; textInput.value='';
      saveConfig(); renderEditRewards(); render();
    });
    suggestWrap.appendChild(addCustom);
    block.appendChild(suggestWrap);

    wrap.appendChild(block);
  });
}

function allRewardsPool(){
  const seen = new Set();
  const pool = [];
  [1,3,5].forEach(th=>{
    (CONFIG.rewards[th]||[]).forEach(r=>{
      if(!seen.has(r.text)){ seen.add(r.text); pool.push(r); }
    });
  });
  return pool;
}

document.getElementById('resetRewardsBtn').addEventListener('click', ()=>{
  CONFIG.rewards = JSON.parse(JSON.stringify(DEFAULT_REWARDS));
  saveConfig();
  renderEditRewards();
  render();
  showStatus('Récompenses réinitialisées');
});

document.getElementById('saveMegaReward').addEventListener('click', ()=>{
  const emoji = document.getElementById('megaEmoji').value.trim() || '🏆';
  const text = document.getElementById('megaLabel').value.trim();
  if(!text) return;
  CONFIG.megaReward = { emoji, text };
  saveConfig();
  render();
  showStatus('Grande récompense enregistrée');
});

/* ---------- Init ---------- */
loadConfig();
loadData();
render();
</script>
